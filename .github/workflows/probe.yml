name: Probe
# Throwaway diagnostics (probe/): when each word of a few songs is really sung, to tune the
# karaoke sweep of lyrics that only time their lines.
on:
  push:
    paths: ['probe/**', '.github/workflows/probe.yml']
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        song:
          - { name: power, query: "Maher Zain The Power Amakhono We Sintu", id: "6076698", artist: "-", title: "-" }
          - { name: assalamu-ar, query: "Maher Zain Assalamu Alayka Arabic Version", id: "4108748", artist: "-", title: "-" }
          - { name: rahmatun, query: "Maher Zain Rahmatun Lil'Alameen", id: "2262383", artist: "-", title: "-" }
          - { name: someone, query: "Adele Someone Like You audio", id: "-", artist: "Adele", title: "Someone Like You" }
          - { name: perfect, query: "Ed Sheeran Perfect audio", id: "-", artist: "Ed Sheeran", title: "Perfect" }
          - { name: blinding, query: "The Weeknd Blinding Lights audio", id: "-", artist: "The Weeknd", title: "Blinding Lights" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
      - run: pip install -q -U "yt-dlp[default]" faster-whisper
      - run: python probe/align.py "${{ matrix.song.name }}" "${{ matrix.song.query }}" "${{ matrix.song.id }}" "${{ matrix.song.artist }}" "${{ matrix.song.title }}"
