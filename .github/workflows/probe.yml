name: Probe
# Throwaway diagnostics (probe/): when each word of a few songs is really sung, to tune the
# karaoke sweep of lyrics that only time their lines.
on:
  push:
    paths: ['probe/**', '.github/workflows/probe.yml']
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q faster-whisper
      - run: python probe/align.py
