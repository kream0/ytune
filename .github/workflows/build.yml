name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "YTUNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the public dev key (keystore/ytune-dev.jks)"
          fi

      - name: Build release APK
        env:
          YTUNE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YTUNE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YTUNE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "^e: |error:|What went wrong|Could not (find|resolve)" -A 2 build.log | head -120 || true

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ytune.apk
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ytune-${{ github.run_number }}
          path: dist/ytune.apk

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build #${GITHUB_RUN_NUMBER} from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Open this page on your phone and tap ytune.apk to install."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ytune.apk \
            --target "$GITHUB_SHA" \
            --title "YTune — latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" \
            --latest
