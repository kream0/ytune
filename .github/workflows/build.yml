name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "YTUNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the public dev key (keystore/ytune-dev.jks)"
          fi

      - name: Build release APK
        env:
          YTUNE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YTUNE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YTUNE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "^e: |error:|What went wrong|Could not (find|resolve)" -A 2 build.log | head -120 || true

      - name: Collect APK + version manifest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ytune.apk
          # Read by the in-app updater to decide whether a newer build exists.
          jq -n \
            --argjson code "$GITHUB_RUN_NUMBER" \
            --arg name "1.0.$GITHUB_RUN_NUMBER" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg notes "$(git log -1 --format=%s)" \
            --arg sha256 "$(sha256sum dist/ytune.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s dist/ytune.apk)" \
            '{versionCode: $code, versionName: $name, commit: $commit, branch: $branch, notes: $notes, sha256: $sha256, size: $size}' \
            > dist/version.json
          cat dist/version.json
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ytune-${{ github.run_number }}
          path: |
            dist/ytune.apk
            dist/version.json

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build #${GITHUB_RUN_NUMBER} from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Open this page on your phone and tap ytune.apk to install."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ytune.apk dist/version.json \
            --target "$GITHUB_SHA" \
            --title "YTune — latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" \
            --latest
